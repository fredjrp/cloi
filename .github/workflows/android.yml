name: Build Android APK

# Builds and signs the CloiDm APK on GitHub's runners so a slow local machine is
# never in the path. Runs on demand, and on any push that touches the app.
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Backend base URL baked into the APK'
        required: false
        default: 'https://app.cloidm.online'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + sign
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # The ubuntu-latest image already ships a working Android SDK with
      # ANDROID_HOME set. android-actions/setup-android tries to "repair" it by
      # downloading new cmdline-tools, which is slow and has been failing on a
      # preinstalled-sdkmanager version mismatch. We only need to confirm it is there.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME" || { echo "::error::No Android SDK on this runner"; exit 1; }
          ls "$ANDROID_HOME" | head -10
          echo "build-tools:"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "  (none yet - gradle will fetch)"
          echo "platforms:";   ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "  (none yet - gradle will fetch)"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Build web bundle
        env:
          # Baked into the JS at build time. Overridable per run.
          VITE_API_BASE: ${{ inputs.api_base || 'https://app.cloidm.online' }}
        run: npm run build

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate launcher icons and splash from assets/
        run: npx capacitor-assets generate --android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      # ---- signing -------------------------------------------------------
      # The keystore is stored as a base64 secret so no binary blob lives in the
      # repo. If the secrets are absent the build still succeeds but produces an
      # UNSIGNED apk, which Android will refuse to install - so we fail loudly
      # instead of shipping something that cannot be installed.
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the keystore secret first."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/cloidm-release.keystore

      - name: Write signing config
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=cloidm-release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 android/keystore.properties

      - name: Inject signing into build.gradle
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/build.gradle")
          s = p.read_text()

          if "keystore.properties" not in s:
              # load the properties file near the top of the build script
              s = s.replace(
                  "apply plugin: 'com.android.application'",
                  "apply plugin: 'com.android.application'\n\n"
                  "def keystoreProperties = new Properties()\n"
                  "def keystorePropertiesFile = rootProject.file('keystore.properties')\n"
                  "if (keystorePropertiesFile.exists()) {\n"
                  "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n"
                  "}"
              )

          if "signingConfigs" not in s:
              # add a release signing config and point the release build at it
              s = re.sub(
                  r"android\s*\{",
                  "android {\n    signingConfigs {\n        release {\n"
                  "            storeFile file(keystoreProperties['storeFile'])\n"
                  "            storePassword keystoreProperties['storePassword']\n"
                  "            keyAlias keystoreProperties['keyAlias']\n"
                  "            keyPassword keystoreProperties['keyPassword']\n"
                  "        }\n    }",
                  s, count=1
              )
              s = re.sub(
                  r"buildTypes\s*\{\s*release\s*\{",
                  "buildTypes {\n        release {\n            signingConfig signingConfigs.release",
                  s, count=1
              )
          p.write_text(s)
          print("signing config injected")
          PY

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is actually signed
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK"
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs "$APK" || {
            echo "::error::APK signature verification failed"; exit 1; }

      - name: Rename artifact
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          SHORT=$(git rev-parse --short HEAD)
          cp "$APK" "cloidm-${SHORT}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cloidm-apk
          path: cloidm-*.apk
          retention-days: 30

      - name: Summary
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          SIZE=$(du -h "$APK" | cut -f1)
          echo "### APK built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** \`$(basename $APK)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** \`${{ inputs.api_base || 'https://app.cloidm.online' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

